name: Initial preview verification

# Temporary owner-authorized release check. Remove before merging to main.
# Updating this explicit operations branch is a deliberate run request.
on:
  push:
    branches: [ops/preview-check]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: initial-preview-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SITE_INDEXABLE: 'false'
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the locked toolchain
        run: npm ci
      - name: Formatting
        id: formatting
        continue-on-error: true
        run: npm run format:check
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Astro and TypeScript checks
        id: types
        continue-on-error: true
        run: npm run check
      - name: Unit tests
        id: unit
        continue-on-error: true
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the project-path preview
        id: build
        continue-on-error: true
        run: npm run build
      - name: Browser and accessibility checks
        id: browser
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: npm run test:e2e
      - name: Isolated fixture checks
        id: fixtures
        continue-on-error: true
        run: npm run test:fixtures
      - name: Alternate root-path checks
        id: root
        continue-on-error: true
        env:
          SITE_BASE: /
        run: npm run build && npm run test:e2e
      - name: Collect review source and formatting patch
        if: always()
        run: |
          mkdir -p review
          git rev-parse HEAD > review/source-commit.txt
          npm run format > review/formatting.log 2>&1 || true
          git diff --binary > review/formatting.patch
          git ls-files -z | tar --null -T - -czf review/source.tar.gz
          node --version > review/runtime.txt
          npm --version >> review/runtime.txt
      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-review
          path: |
            review/
            test-results/
            playwright-report/
          retention-days: 3
      - name: Require every verification gate
        if: always()
        env:
          FORMATTING: ${{ steps.formatting.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPES: ${{ steps.types.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          FIXTURES: ${{ steps.fixtures.outcome }}
          ROOT: ${{ steps.root.outcome }}
        run: |
          failed=0
          for gate in FORMATTING LINT TYPES UNIT BUILD BROWSER FIXTURES ROOT; do
            result="${!gate}"
            printf '%s: %s\n' "$gate" "$result"
            if [ "$result" != success ]; then failed=1; fi
          done
          exit "$failed"
