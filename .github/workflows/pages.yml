name: Portfolio checks and Pages

# Only owner-controlled branch pushes and manual runs reach the local machines.
# Do not add pull_request or pull_request_target triggers to this public repository.
on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SITE_ORIGIN: https://martin-tahli.github.io
  SITE_BASE: /martin-tahli/
  SITE_INDEXABLE: 'false'
  PORTFOLIO_TEST_CONTENT: 'false'
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    if: >-
      github.repository == 'martin-tahli/martin-tahli' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Record the executing runtime
        run: |
          printf 'Runner: %s / %s\n' "$RUNNER_OS" "$RUNNER_ARCH"
          node --version
          npm --version
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/portfolio-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium without changing host system packages
        run: npx playwright install chromium
      - name: Verify the alternate root deployment
        env:
          SITE_BASE: /
        run: npm run build && npm run test:e2e
      - name: Verify the project-path release candidate and isolated fixtures
        run: npm run verify
      - name: Reject fixture content in the publication artifact
        run: |
          test -s dist/index.html
          test -s dist/404.html
          if grep -R -E 'DO_NOT_PUBLISH_FIXTURE|Test fixture —' dist --include='*.html'; then
            echo 'Synthetic test content cannot be published.' >&2
            exit 1
          fi
      - name: Retain browser review artifacts briefly
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-review-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 3
          if-no-files-found: ignore
      - name: Upload only the normal project-path build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that GitHub Pages is enabled
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish the verified preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
