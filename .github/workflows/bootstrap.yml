name: Bootstrap portfolio dependencies

# One-time setup on the review branch. Removed before review; never deploys.
on:
  push:
    branches: [feat/portfolio-foundation]
    paths: [.github/workflows/bootstrap.yml]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and pin the initial dependency graph
        run: |
          test ! -f package-lock.json
          printf '{"name":"martin-tahli-portfolio","version":"0.1.0","private":true,"type":"module","engines":{"node":">=22.12.0 <23"}}\n' > package.json
          npm install --save-exact astro@7.3.3 @astrojs/mdx @astrojs/sitemap @tailwindcss/vite tailwindcss @fontsource/instrument-serif @fontsource-variable/inter @fontsource/ibm-plex-mono
          npm install --save-dev --save-exact typescript@6.0.3 @astrojs/check @types/node@22 @playwright/test @axe-core/playwright prettier prettier-plugin-astro eslint@10 @eslint/js@10 typescript-eslint eslint-plugin-astro globals
          node --version
          npm --version
          npm ls --depth=0
      - name: Commit only dependency manifests to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: lock the initial portfolio toolchain'
          git push origin HEAD:feat/portfolio-foundation
